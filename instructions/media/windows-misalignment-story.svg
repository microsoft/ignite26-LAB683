<text x="792" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="start" fill="#000000"><tspan x="792" dy="0">Hunt: measure and distinguish outcomes</tspan></text>
<text x="792" y="803" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#000000"><tspan x="792" dy="0">Aggregate scan results; inspect LSASS prevention.</tspan><tspan x="792" dy="29.700000000000003">Do not describe the entire sequence as blocked.</tspan></text>
<text x="40" y="888" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#000000"><tspan x="40" dy="0">Read each branch separately: observed scanning, attempted credential access, and a specific recorded prevention.</tspan></text>
