<text x="62" y="803" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#000000"><tspan x="62" dy="0">Read the user&apos;s request and inspect the child scripts.</tspan><tspan x="62" dy="29.700000000000003">Launching a script does not prove it succeeded.</tspan></text>
