<text x="40" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#000000"><tspan x="40" dy="0">Solid arrows summarize observed task and process relationships; branches are not a complete timeline.</tspan></text>
